name: Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install -r requirements-dev.txt
          # Filet de sécurité si requirements.txt ne liste pas encore tout
          # ce dont les modules testés ont besoin.
          pip install python-docx matplotlib requests pandas

      - name: Lancer les tests
        run: pytest tests/ -v --tb=short

      - name: Vérifier la syntaxe de app.py
        run: python -c "import ast; ast.parse(open('app.py', encoding='utf-8').read()); print('app.py : syntaxe OK')"